<!doctype html>
<html lang="es"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rutas por Galicia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head><body><main class="card">
  <p class="eyebrow">CS50 Final Project</p><h1>Rutas por Galicia</h1>
  <p class="intro">Encuentra la ruta más corta entre veinte poblaciones gallegas con el algoritmo de Dijkstra.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <label for="start">Origen</label>
    <select id="start" name="start" required>{% for town in towns %}<option value="{{ town }}">{{ town }}</option>{% endfor %}</select>
    <label for="destination">Destino</label>
    <select id="destination" name="destination" required>{% for town in towns %}<option value="{{ town }}">{{ town }}</option>{% endfor %}</select>
    <button type="submit">Calcular ruta</button>
  </form>
</main></body></html>
